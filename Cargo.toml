[package]
name = "amirustrained"
version = "0.3.0"
edition = "2024"
description = "Runtime introspection & LPE-posture reporter"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anstyle = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rustix = { version = "1", features = ["fs", "process", "system"] }
libc = "0.2"
aya = "0.14"
aya-obj = "0.3"
object = { version = "0.39", default-features = false }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
tempfile = "3"
insta = "1"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
