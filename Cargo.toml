[package]
name = "amirustrained"
version = "0.1.0"
edition = "2024"
description = "Runtime introspection & LPE-posture reporter"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rustix = { version = "1", features = ["fs", "process", "system"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
insta = "1"
assert_cmd = "2"
predicates = "3"
jsonschema = "0.30"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"