version: 2
updates:
  # Bumps the SHA pins in .github/workflows/* (labels carry the semantic version).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Root crate (amirustrained) and the embedded-BPF crate are separate Cargo
  # workspaces, so each gets its own lockfile updates.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Lockstep with aya-obj 0.3.x (pins object = "0.39").
      # Bump only when aya-obj adopts object 0.40.
      - dependency-name: "object"

  - package-ecosystem: cargo
    directory: /bpf
    schedule:
      interval: weekly
