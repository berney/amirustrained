name: Live Environment Matrix

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build static release binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # master/stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amirustrained-binary
          path: target/x86_64-unknown-linux-musl/release/amirustrained

  # Each leg drives scripts/live-matrix.sh, which calls the per-runtime leaves
  # in scripts/live/ — the same entrypoints used locally and by
  # `cargo test --test live_matrix -- --ignored`.
  matrix:
    name: ${{ matrix.leg.name }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg:
          - { id: host, name: "Host (Azure VM)", envs: "host" }
          - { id: docker-default, name: "Docker Default (unprivileged)", envs: "docker-default" }
          - { id: docker-privileged, name: "Docker Privileged", envs: "docker-privileged" }
          - { id: bubblewrap, name: "Bubblewrap (bwrap sandbox)", envs: "bubblewrap" }
          - { id: unshare, name: "Raw Linux User-NS (unshare)", envs: "unshare" }
          - { id: gvisor, name: "gVisor (runsc)", envs: "gvisor gvisor-sudo gvisor-rootless" }
          # Not every runner exposes /dev/kvm; a missing one records a skip.
          - { id: firecracker, name: "Firecracker MicroVM", envs: "firecracker", flags: "--skip-unavailable" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: amirustrained-binary
          path: bin
      - name: Prepare binary
        run: chmod +x bin/amirustrained
      - name: Provision runtimes
        run: scripts/live-matrix.sh setup --system ${{ matrix.leg.envs }}
      - name: Run live matrix
        env:
          BIN: bin/amirustrained
        run: scripts/live-matrix.sh run ${{ matrix.leg.flags }} ${{ matrix.leg.envs }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: live-matrix-${{ matrix.leg.id }}
          path: target/live-matrix/

  # ── Summary: Generate Environment Comparison Tables ─────────────────────────
  summary:
    name: Generate Environment Comparison Table
    needs: matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: live-matrix-*
          path: target/live-matrix
          merge-multiple: true
      - name: Build Comparison Tables
        run: |
          scripts/live-matrix.sh summary > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
