name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # .cargo/config.toml sets a repo-wide musl build target; std for it
          # must be installed or clippy/test fail with E0463 on gnu-only runners.
          targets: x86_64-unknown-linux-musl
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test